{% extends 'club_app/base.html' %}

{% block content %}
<div class="form-container">
    <h2>Events</h2>

    {% for event in events %}
        <p>{{ event.name }} - {{ event.date }} - {{ event.location }}</p>
    {% empty %}
        <p>No events have been added yet.</p>
    {% endfor %}
</div>

{% endblock %}
